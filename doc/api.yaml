  /groups:
    post:
      operationId: 'createGroup'
      description: 'Creates a new group chat with a name, an optional photo, and a list of initial members'
      summary: 'Create a new group chat'
      tags: ['Group']
      requestBody:
        description: 'Group creation data: name, photo (optional) and list of initial members'
        content:
          multipart/form-data:
            schema:
              description: 'Object containing the multipart payload (JSON data + binary file)'
              type: object
              properties:
                data:
                  description: 'Group data in JSON format'
                  type: object
                  properties:
                    name:
                      $ref: '#/components/schemas/GroupName'
                    members:
                      description: |
                        List of the UserId of the initial members of the group,
                        the creator is already inside this list, so it is the whole group
                      type: array
                      items:
                        $ref: '#/components/schemas/UserId'
                      minItems: 2                     # the creator plus at least one other member
                      maxItems: 100
                      uniqueItems: true               # ensure that each member could be once in the members list
                  required: [name, members]
                photoFile:
                  $ref: '#/components/schemas/Photo'
              required: [data]
            encoding:                                 # for multipart/form-data with JSON field
              data:
                contentType: application/json
        required: true
      responses:
