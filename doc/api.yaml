    post:
      operationId: 'addToGroup'
      description: |
        Adds one or more users to an existing group chat the user is a member of.
        If a user is already a member, they should be ignored
      summary: 'Add users in a group'
      tags: ['Group']
      parameters:
        - $ref: '#/components/parameters/ParamChatId'
      requestBody:
        description: 'List of the UserId of the new members to add to the group'
        content:
          application/json:
            schema:
              description: 'Payload for new members'
              type: object
              properties:
                members:
                  description: 'New members userId'
                  type: array
                  items:
                    $ref: '#/components/schemas/UserId'
                  minItems: 0                             # an empty list is a request that adds nobody
                  maxItems: 100                           # better: group max size - group current size
                  uniqueItems: true                       # ensure that each member could be once in the members list
        required: true
      responses:
        '200':
          description: 'New member added to the group successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
              example:
                id: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
                chatType: 'group'
                name: 'Computer Science Study Group'
                photo: 'https://api.wasatext.com/photos/cs_group.png'
                members: ['90b2c3d4-e5f6-42ec-a945-5fd21dec0538', '70b2c3d4-e5f6-42ec-a945-5fd21dec0538', '80b2c3d4-e5f6-42ec-a945-5fd21dec0538']
                snippet:
                  id: '25614180-65aa-42ac-a945-5fd21dec0538'
                  content:
                    text: 'The exam is next Monday at 9 AM.'
                    emoji: '📷'
                  date: '2025-11-10T09:05:00Z'
                  user: '90b2c3d4-e5f6-42ec-a945-5fd21dec0538'
                  state: 'received'
                messages:
                  - id: 'a1b2c3d4-e5f6-42ec-a945-5fd21dec0538'
                    content:
                      text: 'Hey everyone, does anyone know the exam schedule?'
                    date: '2025-11-10T09:00:00Z'
                    user: '70b2c3d4-e5f6-42ec-a945-5fd21dec0538'
                    state: 'read'
                    comments: []
                  - id: 'c56a4180-65aa-42ec-a945-5fa21dec0538'
                    content:
                      text: 'The exam is next Monday at 9 AM.'
                      photo: 'https://api.wasatext.com/photos/exameSchedule.jpg'
                    date: '2025-11-10T09:05:00Z'
                    user: '90b2c3d4-e5f6-42ec-a945-5fd21dec0538'
                    state: 'received'
                    comments: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

